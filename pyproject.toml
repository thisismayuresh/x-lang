[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-language"
version = "0.1.0"
description = "A Python interpreter for the experimental X programming language"
requires-python = ">=3.10"

[project.scripts]
x = "xlang.cli:main"

[tool.setuptools]
packages = ["xlang"]
