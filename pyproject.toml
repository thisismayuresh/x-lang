[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-language"
version = "0.1.0"
description = "A Python interpreter for the experimental X programming language"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
x = "xlang.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pygls>=2.1", "lsprotocol>=2024"]

[tool.setuptools.packages.find]
include = ["xlang*"]

[tool.pytest.ini_options]
filterwarnings = [
    # X's async functions are Python coroutines under the hood; user code may
    # store or pass them around, and CPython's GC-time "never awaited" warning
    # is an implementation detail. xlang/__init__.py applies the same filter
    # at runtime; pytest's warning capture overrides package filters.
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]
