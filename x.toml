[cli]
default-command = "run"
color = "auto"

[features]
strict_typing = false

[run]
args = []

[run.environment]
X_PROJECT = "x-language"

[run.profiles.feature-tour]
args = ["argument from x.toml", "an argument with spaces"]

[run.profiles.feature-tour.environment]
X_MODE = "feature-tour"

# Standard-library modules imported into every .x file by default, exactly as
# if each file started with `import <name>`.  Re-importing one of these in a
# source file triggers a "redundant import" warning.
# For the full list of every supported System module, see x.test.toml.
[imports]
default = [
  "System.utils.Math",
  "System.utils.JSON",
  "System.io.Console",
  "System.io.FileSystem",
]

# Named project commands, like package.json scripts: 'x dev main.x' runs
#   x --watch format main.x
# appending whatever arguments follow the script name (use '--' before
# arguments that start with '-').  The value is an arbitrary shell string,
# so it can be anything: 'x --watch run main.x', 'npm test', etc.
[scripts]
dev = "x --watch format"
