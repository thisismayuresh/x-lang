[cli]
default-command = "run"
color = "auto"

[features]
strict_typing = true

[run]
args = []

[run.environment]
X_PROJECT = "x-language"

[run.profiles.feature-tour]
args = ["argument from x.toml", "an argument with spaces"]

[run.profiles.feature-tour.environment]
X_MODE = "feature-tour"

# Standard-library modules imported into every .x file by default, exactly as
# if each file started with `import <name>`.  Re-importing one of these in a
# source file triggers a "redundant import" warning.
[imports]
default = ["System.utils.Math", "System.utils.JSON", "System.io.Console", "System.io.FileSystem"]

