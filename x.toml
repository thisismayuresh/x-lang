[cli]
default-command = "run"
color = "auto"

[features]
async = true
classes = true
decorators = true
destructuring = true
enums = true
equality = true
exceptions = true
filesystem = true
loops = true
namespaces = true
object_literals = true
pattern_matching = true
spread = true
threads = true

[run]
args = []

[run.environment]
X_PROJECT = "x-language"

[run.profiles.feature-tour]
args = ["argument from x.toml", "an argument with spaces"]

[run.profiles.feature-tour.environment]
X_MODE = "feature-tour"
