[cli]
default-command = "run"
color = "auto"

# Language features default to on. Set any flag to false (or pass
# --feature NAME=off) to disable that syntax or runtime capability.
# 
# WARNING: All features are enabled by default!
# Run 'x --help' for documentation on available features and configuration.
# 
# strict_typing: When true, requires explicit type annotations on all functions,
# variables, and parameters. When false (default), types are inferred.
# WARNING: With strict_typing = false, type errors may only surface at runtime!

[features]
arrow_functions = true
async = true
classes = true
collections = true
concurrency_primitives = true
decorators = true
destructuring = true
enums = true
equality = true
exceptions = true
filesystem = true
generics = true
interfaces = true
loops = true
namespaces = true
object_literals = true
pattern_matching = true
records = true
spread = true
static_methods = true
switch = true
threads = true
type_checker = true
unions = true
access_modifiers = true
strict_typing = false
enhanced_input = true
command_input = true

[run]
args = []

[run.environment]
X_PROJECT = "x-language-test"

[run.profiles.feature-tour]
args = ["argument from x.toml", "an argument with spaces"]

[run.profiles.feature-tour.environment]
X_MODE = "feature-tour"
# Scripts run with 'x <name>', similar to package.json scripts. Script names
# must be single words, non-empty, and cannot shadow a built-in command
# (run, check, build, install). Reference values of every supported section
# are shown here.
[scripts]
start = "x run examples/main.x"
dev = "x -watch run examples/main.x"

# Modules imported into every source file by default (as if 'import <name>'
# appeared first in every file). Re-importing any of these in a .x source
# produces the "redundant import" warning. Every supported System module is
# listed below, so this is the complete 'import everything by default' form.
[imports]
default = [
  "System.concurrent.Async",
  "System.concurrent.Thread",
  "System.Environment",
  "System.io.Console",
  "System.io.FileSystem",
  "System.io.Network",
  "System.io.Network.http",
  "System.io.Network.http.fetch",
  "System.Throwable",
  "System.Throwable.Error",
  "System.Throwable.Error.DatabaseError",
  "System.Throwable.Exception",
  "System.Throwable.Exception.DatabaseException",
  "System.Throwable.Exception.IOException",
  "System.Throwable.Exception.IOException.FileSystemException",
  "System.Throwable.Exception.IOException.HttpException",
  "System.Throwable.Exception.RuntimeException",
  "System.Throwable.Exception.RuntimeException.ArithmeticException",
  "System.Throwable.Exception.RuntimeException.IllegalArgumentException",
  "System.Throwable.Exception.RuntimeException.IndexOutOfBoundsException",
  "System.Throwable.Exception.RuntimeException.TypeException",
  "System.utils.Collections",
  "System.utils.Collections.HashMap",
  "System.utils.Collections.LinkedList",
  "System.utils.Collections.List",
  "System.utils.Collections.PriorityQueue",
  "System.utils.Collections.Queue",
  "System.utils.Collections.Set",
  "System.utils.Collections.Stack",
  "System.utils.Collections.Trie",
  "System.utils.JSON",
  "System.utils.JSON.toJSON",
  "System.utils.Math",
]
