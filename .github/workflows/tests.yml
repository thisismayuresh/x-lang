name: Tests

# Runs the full Python test suite (unit tests + regression corpus), verifies
# the docs-site playground wheel is not stale, and syntax-checks the
# docs-site JavaScript. Runs on every push and pull request to the main
# branches so a red check means a new regression.

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Install TypeScript (tsc compile tests)
        run: npm install --global typescript

      # One command covers the interpreter tests and the generated corpus
      # (tests/corpus_data.py); no --deselect list: every test must pass.
      - name: Run test suite
        run: python -m pytest tests/ -q

  playground-wheel:
    name: playground wheel freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check wheel matches xlang/
        run: python docs-site/playground/build.py --check

  js-syntax:
    name: docs-site JS syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check authored JS (skip vendored Monaco/Pyodide)
        run: |
          find docs-site -name '*.js' \
            -not -path '*monaco*' \
            -not -path '*pyodide*' \
            -not -path '*node_modules*' \
            | xargs -r -n1 node --check
